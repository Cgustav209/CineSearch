<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Search</title>
    <link rel="icon" type="image/png" href="./src/img/logo.png" />
    <link rel="stylesheet" href="./src/css/principalstyles.css" />
  </head>
  <body>
    <header>
      <div class="headerLogo">
        <img class="logo" alt="logo" src="./src/img/logo.png" />
      </div>

      <div class="search-container">
        <form id="search-form">
          <input
            id="search-input"
            type="text"
            placeholder="Digite o nome do filme..."
            required
          />
        </form>
        <input class="botao" type="submit" value="Buscar" id="btnBuscar" />
      </div>
    </header>
    <hr />
    <main>
      <section class="sessaoFilmes" id="movies-container">
        <div class="apresentacao">
          <div class="apresentacao-texto">
            <hr />
            <h2 id="categoria">Todos</h2>
          </div>
          <div class="quantidade">
            <h2 id="quantidade-filmes"></h2>
            <p>filmes</p>
          </div>
        </div>
        <!-- Os filmes serão exibidos aqui -->
        <div class="filmes" id="movies-list">
          <!-- <a href="#" class="filme">
                    <img id=" posterFilme" src="" alt="Poster">
                    <h3 id="tituloFilme">Titulo</h3>
                    <div>
                        <p id="lancamento">2020</p>
                    
                    </div>
                 </a> -->
        </div>
      </section>
    </main>

    <footer>
      <p>
        &copy; 2026 Cine Search. Todos os direitos reservados a Cgustav209 e
        Heitor-Guimaraes-10 .
      </p>
    </footer>
    <script src="./js/script.js"></script>
  </body>
</html>
